name: Polish and verify repair directions

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'agent/strengthen-repair-directions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply readability and canonical-decision polish
        run: python3 scripts/agent_polish_repair_direction.py
      - name: Verify the intended final tree
        shell: bash
        run: |
          rm -f scripts/agent_polish_repair_direction.py .github/workflows/polish-repair-directions.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          make validate
      - name: Commit verified polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No polish changes produced"; exit 1; }
          git commit -m "Polish repair direction implementation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
