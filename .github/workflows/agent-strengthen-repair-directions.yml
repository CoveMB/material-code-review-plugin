name: Apply repair-direction strengthening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'agent/strengthen-repair-directions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run the red-green patch
        id: patch
        shell: bash
        run: |
          set +e
          python3 scripts/agent_strengthen_repair_directions.py 2>&1 | tee /tmp/repair-patch.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload bounded patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-patch-log
          path: /tmp/repair-patch.log
          retention-days: 1
      - name: Fail on patch error
        if: steps.patch.outputs.status != '0'
        run: exit 1
      - name: Commit verified changes
        if: steps.patch.outputs.status == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "Strengthen repair direction contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
