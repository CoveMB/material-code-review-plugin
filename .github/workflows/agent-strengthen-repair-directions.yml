name: Apply repair-direction strengthening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'agent/strengthen-repair-directions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Reassemble and run the red-green patch
        shell: bash
        run: |
          cat .github/agent/min.b64.* | base64 --decode > scripts/agent_strengthen_repair_directions.py
          python3 scripts/agent_strengthen_repair_directions.py
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "Strengthen repair direction contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
